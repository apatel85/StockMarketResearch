name: Daily Sector Briefing

# Cron is UTC. These four windows cover 5:00 AM and 5:00 PM ET under both EST and EDT;
# the script's --session auto guard runs exactly once per intended ET time (skips others).
on:
  schedule:
    - cron: "0 9 * * 1-5"    # 5am ET (EDT) / 4am ET (EST -> skipped)
    - cron: "0 10 * * 1-5"   # 5am ET (EST) / 6am ET (EDT -> skipped)
    - cron: "0 21 * * 1-5"   # 5pm ET (EDT) / 4pm ET (EST -> skipped)
    - cron: "0 22 * * 1-5"   # 5pm ET (EST) / 6pm ET (EDT -> skipped)
  workflow_dispatch:
    inputs:
      session:
        description: "Session to run (am, pm, or auto)"
        default: "pm"
        type: choice
        options: [am, pm, auto]
  # Run a PM briefing automatically whenever the app changes land on the default branch
  # (e.g. when you merge a PR) — gives an immediate live report without using the UI.
  # The bot's own archive commits carry "[skip ci]" so this never loops.
  push:
    branches: [ daily-briefing-app-17263322209186605240 ]
    paths: [ "daily-sector-briefing/**" ]

permissions:
  contents: write   # commit the archived report/data
  pages: write
  id-token: write

concurrency:
  group: sector-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-sector-briefing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        # dispatch -> chosen session; schedule -> auto (resolves to am/pm by ET hour);
        # push/merge -> pm (recap of the last completed session).
        run: |
          python -m src.run_briefing --session "${{ github.event.inputs.session || (github.event_name == 'schedule' && 'auto') || 'pm' }}"

      - name: Commit archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "Sector briefing $(date -u +%Y-%m-%d) [skip ci]"
            git push
          else
            echo "No new briefing artifacts to commit."
          fi

      # Build the Pages artifact from the FRESHLY generated reports/ in this job's
      # workspace (not a later checkout), so what we publish is what we just produced.
      - uses: actions/configure-pages@v5
        if: always()
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: daily-sector-briefing/reports

  # Deploy the artifact uploaded above. No checkout needed.
  deploy-pages:
    needs: briefing
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
